[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roughcut"
version = "0.1.0"
description = "Automatic rough cut generator for CapCut Desktop"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
roughcut = "roughcut.cli:main"
