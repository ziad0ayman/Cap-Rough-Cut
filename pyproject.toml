[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caproughcut"
version = "0.1.0"
description = "CapRoughCut: Automatic rough cut generator for CapCut Desktop"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "rapidfuzz>=3.0.0",
    "certifi>=2024.0.0"
]

[project.scripts]
caproughcut = "roughcut.cli:main"
